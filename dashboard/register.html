<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Create account | SecureFlow</title>
    <link rel="stylesheet" href="/home.css">
    <link rel="stylesheet" href="/auth.css">
    <script src="/auth-page.js" defer></script>
</head>

<body class="auth-page" data-auth-mode="register">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header auth-header">
        <a class="brand" href="/" aria-label="SecureFlow home">
            <span class="brand-mark" aria-hidden="true"><span></span></span><span>secureflow</span>
        </a>
        <a class="sign-in" href="/login">Sign in</a>
    </header>
    <main id="main" class="auth-layout">
        <section class="auth-content" aria-labelledby="auth-title">
            <p class="eyebrow">SECUREFLOW ACCOUNT</p>
            <h1 id="auth-title">Create your account</h1>
            <p class="auth-intro">Your scan history is private to your account.</p>
            <form id="auth-form" novalidate>
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="12"
                    maxlength="128" aria-describedby="password-hint" required>
                <p id="password-hint" class="auth-hint">Use 12 to 128 UTF-8 bytes.</p>
                <p id="form-error" class="auth-error" role="alert" aria-live="assertive" hidden></p>
                <button class="button auth-submit" type="submit">Create account</button>
            </form>
            <p class="auth-switch">Already registered? <a href="/login">Sign in</a></p>
        </section>
    </main>
</body>

</html>
