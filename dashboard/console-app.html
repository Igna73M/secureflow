<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" />
    <script>
        try {
            const saved = localStorage.getItem("secureflow-theme");
            const theme = saved === "light" || saved === "dark" ? saved : (window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light");
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#0F172A" : "#F8FAFC";
        } catch {
            document.documentElement.dataset.theme = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
        }
    </script>
    <script type="module" src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>SecureFlow | Console</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
